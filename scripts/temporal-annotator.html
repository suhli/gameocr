<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>GameOCR 序列标注</title>
<style>body{font:16px system-ui;margin:24px;background:#f4f6fa;color:#192539}button,input{font:inherit;padding:7px;margin:5px}canvas{display:block;max-width:100%;background:#182030;touch-action:none;cursor:crosshair}label{display:inline-block}#rows{max-height:220px;overflow:auto}.row{display:flex;align-items:center} .row input{flex:1}p{line-height:1.6;color:#526079}button{cursor:pointer}#status{font-weight:bold}</style>
<h1>GameOCR 序列标注</h1><p>选择同一序列的截图，在画面上拖出文字框并填写实际文字。每帧完成后勾选“已校对”；无文字帧也需确认。所有图片和标注仅在本机处理。</p>
<input id="files" type="file" multiple accept="image/png,image/jpeg"><button id="prev">上一帧</button><button id="next">下一帧</button><span id="status">尚未选择截图</span>
<div><label>序列名称 <input id="name" value="game-sequence"></label><label>当前帧时间 (ms) <input id="time" type="number" min="0"></label><label>来源编号 <input id="generation" type="number" value="1" min="1"></label><label><input id="checked" type="checkbox">已校对本帧全部文字</label></div>
<canvas id="image"></canvas><div id="rows"></div><button id="export">导出标注</button><p>将导出的 annotations.json 保存到这些截图所在的文件夹。切换窗口或场景时可增加来源编号。拖错的框可删除重画。</p>
<script type="module">
const $=id=>document.getElementById(id),canvas=$('image'),ctx=canvas.getContext('2d');let frames=[],index=0,start=null,drag=null;
function current(){return frames[index]}
function render(){const f=current();if(!f)return;canvas.width=f.bitmap.width;canvas.height=f.bitmap.height;ctx.drawImage(f.bitmap,0,0);ctx.lineWidth=Math.max(2,canvas.width/700);ctx.strokeStyle='#ff7b18';for(const box of [...f.groundTruth,...(drag?[{bbox:drag}]:[])]){const [x,y,r,b]=box.bbox;ctx.strokeRect(x,y,r-x,b-y)}$('status').textContent=`${index+1} / ${frames.length} · ${f.image}`;$('time').value=f.atMs;$('generation').value=f.generation;$('checked').checked=f.reviewed;}
function rows(){const root=$('rows');root.replaceChildren();for(const [i,line] of current().groundTruth.entries()){const row=document.createElement('div');row.className='row';const input=document.createElement('input');input.value=line.text;input.placeholder='填写框内实际文字';input.ariaLabel=`文字 ${i+1}`;input.oninput=()=>{line.text=input.value;current().reviewed=false;$('checked').checked=false};const remove=document.createElement('button');remove.textContent='删除框';remove.onclick=()=>{current().groundTruth.splice(i,1);current().reviewed=false;rows();render()};row.append(input,remove);root.append(row)}}
$('files').onchange=async()=>{for(const f of frames)f.bitmap.close();frames=[];index=0;for(const file of [...$('files').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))){frames.push({image:file.name,bitmap:await createImageBitmap(file),atMs:frames.length*100,generation:1,groundTruth:[],reviewed:false})}if(frames.length){render();rows()}};
function position(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width)),Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height))]}
canvas.onpointerdown=e=>{if(!current())return;start=position(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!start)return;const p=position(e);drag=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];render()};canvas.onpointerup=()=>{if(drag&&drag[2]-drag[0]>2&&drag[3]-drag[1]>2){current().groundTruth.push({text:'',bbox:drag.map(Math.round)});current().reviewed=false}start=drag=null;render();rows()};canvas.onpointercancel=()=>{start=drag=null;render()};
$('prev').onclick=()=>{if(index>0){index--;render();rows()}};$('next').onclick=()=>{if(index+1<frames.length){index++;render();rows()}};
$('time').onchange=()=>{if(current())current().atMs=Number($('time').value)};$('generation').onchange=()=>{if(current())current().generation=Number($('generation').value)};$('checked').onchange=()=>{if(current())current().reviewed=$('checked').checked};
$('export').onclick=()=>{if(!frames.length||frames.some(f=>!f.reviewed||!Number.isFinite(f.atMs)||f.atMs<0||!Number.isInteger(f.generation)||f.generation<1||f.groundTruth.some(g=>!g.text.trim()))){alert('请填写文字、检查时间，并逐帧确认已校对。');return}if(frames.some((f,i)=>i&&f.atMs<frames[i-1].atMs)){alert('帧时间必须按顺序递增。');return}const body={schemaVersion:1,source:'human-annotated',scenarios:[{name:$('name').value,frames:frames.map(({bitmap,reviewed,...f})=>f)}]};const url=URL.createObjectURL(new Blob([JSON.stringify(body,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='annotations.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>

[package]
name = "gameocr"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "gameocr"

[features]
test-fixture = []

[[bin]]
name = "executor-bench"
path = "src/bin/executor-bench.rs"
required-features = ["test-fixture"]

[[bin]]
name = "capture-fixture"
path = "src/bin/capture-fixture.rs"
required-features = ["test-fixture"]

[lib]
name = "gameocr_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cuda-runtime-install"
path = "src/bin/cuda-runtime-install.rs"
required-features = ["test-fixture"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
gameocr-core = { path = "../crates/gameocr-core", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
base64 = "0.22"
parking_lot = "0.12"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

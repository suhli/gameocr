[package]
name = "gameocr-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["inference"]
inference = ["dep:llama-cpp-2", "dep:encoding_rs"]
cuda = ["inference", "llama-cpp-2/cuda"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1"
sha2 = "0.10"
llama-cpp-2 = { version = "=0.1.159", optional = true, default-features = false, features = ["mtmd"] }
encoding_rs = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "model-test"
path = "src/bin/model-test.rs"
required-features = ["inference"]

[[bin]]
name = "ocr-worker"
path = "src/bin/ocr-worker.rs"
required-features = ["inference"]

name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - name: Frontend validation
        run: |
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
      - name: Rust formatting and model-independent tests
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p gameocr-core --no-default-features --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p gameocr-onnx --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/resources/workers,src-tauri/resources/runtime,src-tauri/resources/licenses | Out-Null
          cargo test -p gameocr --lib --locked
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cufft", "nvrtc", "nvrtc_dev", "nvjitlink"]'
      - name: Fetch pinned cuDNN redistributable
        run: ./scripts/fetch-cudnn.ps1
      - name: Build standalone CPU and CUDA workers
        run: ./scripts/build-workers.ps1 -Backend both -Profile release
      - name: Real PP-OCRv6 small and medium CPU inference
        run: |
          ./scripts/fetch-onnx-models.ps1
          $env:ORT_DYLIB_PATH = (Resolve-Path src-tauri/resources/workers/onnx/cpu/onnxruntime.dll).Path
          $env:GAMEOCR_ONNX_WORKER = (Resolve-Path src-tauri/resources/workers/onnx/cpu/onnx-worker.exe).Path
          node scripts/test-onnx.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Collect dependency licenses
        run: node scripts/collect-licenses.mjs
      - name: Build standard installers
        run: npm run tauri -- build --bundles nsis,msi
      - name: Collect installers
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $nsis = Get-ChildItem target/release/bundle/nsis/*.exe
          $msi = Get-ChildItem target/release/bundle/msi/*.msi
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) { throw 'Expected exactly one NSIS and MSI artifact' }
          Copy-Item -LiteralPath $nsis.FullName -Destination artifacts/GameOCR-windows-x64-setup.exe
          Copy-Item -LiteralPath $msi.FullName -Destination artifacts/GameOCR-windows-x64.msi
      - name: Build portable without WebView2 installer or check
        run: |
          npm run tauri -- build --no-bundle --config src-tauri/tauri.portable.conf.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/package-portable.ps1
      - run: ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GameOCR-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/GameOCR-windows-x64-portable.zip
            artifacts/GameOCR-windows-x64-setup.exe
            artifacts/GameOCR-windows-x64.msi
            artifacts/SHA256SUMS.txt
            docs/test-results/onnx-cpu-e2e.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GameOCR-windows-x64
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --draft --generate-notes --title "GameOCR $RELEASE_TAG"

[workspace]
members = ["crates/gameocr-core", "crates/gameocr-onnx", "crates/gameocr-translation", "src-tauri"]
default-members = ["crates/gameocr-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

